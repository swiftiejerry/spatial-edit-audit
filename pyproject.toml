[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "spatial-edit-audit"
version = "0.1.0"
description = "Controlled simulation and counterfactual audit toolkit for evaluating selective local spatial multi-omics edits."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
  { name = "Diandian Zuo", email = "zuodiandian2@qq.com" },
]
keywords = [
  "spatial-multi-omics",
  "selective-prediction",
  "benchmark-methodology",
  "conformal-calibration",
  "counterfactual-audit",
]
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scipy>=1.11",
  "scikit-learn>=1.3",
  "anndata>=0.10",
  "h5py>=3.10",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "openpyxl>=3.1",
]
baselines = [
  "torch>=2.1",
  "torch-geometric>=2.6",
  "scanpy>=1.10",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
