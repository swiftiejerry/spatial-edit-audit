# Component gate parameters for the single-channel prototype (M0) and calibrated dual-channel baseline

prototype_m0:
  confirmation_channel: Q
  k_knn: 6
  min_component_size: 5
  rare_max_fraction: 0.15
  max_total_edit_fraction: 0.15
  min_spatial_coherence: 0.55
  max_boundary_leakage: 0.55   # algebraically satisfied whenever spatial_coherence >= 0.55
  min_independent_agreement: 0.60
  min_control_multiplier: 1.0
  min_local_effect: 0.75
  min_affected_feature_fraction: 0.10
  n_null_permutations: 199
  max_local_null_p: 0.05
  n_bootstrap: 199
  bound_confidence: 0.95
  min_gain_lower_bound: 0.50
  max_damage_upper_bound: 0.55

calibrated_dual_gate:
  rule: min
  spot_cap_fractions: [0.05, 0.15]
  min_component_size: 5
  rare_max_fraction: 0.15
  use_static_damage_gate: false
