# Controlled benchmark configuration for selective local spatial multi-omics edits
seed_root: 20261111
latent_dims: 16
noise_sigma: 0.5

preprocessing:
  min_prevalence_fraction: 0.01
  library_target_sum: 10000
  log_transform: log1p
  rna_top_variable_genes: 2000
  atac_top_variable_peaks: 5000
  adt_top_features: null
  mad_scale_factor: 1.4826

spatial_graph:
  knn_k: 6
  symmetrization: max_undirected
  target_tile_size: 20
  min_tile_size: 5
  low_departure_max: 0.20
  high_departure_min: 0.35

blocks:
  block_1_calibration:
    n_per_section: 199
    sampling: uniform_n1_n2_n3
    order_statistic_k: 190
    nominal_alpha: 0.05
  block_2_main:
    n_per_stratum_per_section: 20
    strata:
      N1: pure_noise
      N2: isolated_unilateral_decoys
      N3: adjacent_unilateral_decoys
      S4: concordant_dose_1.0
      S5: concordant_dose_2.0
      S6: concordant_dose_3.0
      S7: concordant_dose_4.0
      S8: cross_boundary_dose_3.0
      S9: asymmetric_3.0_vs_1.0
  block_3_secondary:
    n_per_section: 30
    grown_patch_size: 20
    primary_dose: 6.0
    moderate_sensitivity_dose: 3.0
    fixed_budget_fraction: 0.03

fixed_budgets:
  fractions: [0.01, 0.03, 0.05]
  primary_fraction: 0.03
